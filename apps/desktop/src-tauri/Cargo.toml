[package]
name = "serverdesk"
version.workspace = true
edition.workspace = true
description = "ServerDesk — 本地服务器管理工具"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：菜单栏常驻图标（关闭主窗口后靠它回来、真正退出也在这里）
# tray-icon：菜单栏常驻图标；unstable：`Manager::get_window`（右键菜单要拿 Window 弹原生菜单）
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-updater = { workspace = true }
tauri-plugin-process = { workspace = true }
shared = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true }
russh = { workspace = true }
argon2 = { workspace = true }
keyring = { workspace = true }
zeroize = { workspace = true }
base64 = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
russh-sftp = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
aes-gcm = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
