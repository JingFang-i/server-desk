name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest # x64
            rust_targets: ""
            args: ""
          - platform: ubuntu-22.04 # Debian/Ubuntu x64（glibc 2.35，兼容 Debian 12+）
            rust_targets: x86_64-unknown-linux-gnu
            args: --target x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (Tauri)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install frontend deps
        run: pnpm install
        working-directory: apps/desktop

      - name: Check Vue component imports
        run: python3 scripts/check_vue_imports.py
        working-directory: apps/desktop

      - name: Build MCP sidecar (bundled as app resource)
        run: cargo build --release -p serverdesk-mcp

      # macOS 顺序敏感：先建钥匙串 → 签 target 里的 sidecar 原件 → 再复制进
      # src-tauri/resources（bundler 随后整包签名+公证；保留钥匙串在 search list
      # 供 bundler 的 APPLE_SIGNING_IDENTITY 使用）
      - name: Setup macOS signing keychain
        if: runner.os == 'macOS'
        run: bash scripts/setup-macos-keychain.sh
        working-directory: apps/desktop
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Codesign MCP sidecar (macOS)
        if: runner.os == 'macOS'
        run: codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$GITHUB_WORKSPACE/target/release/serverdesk-mcp"
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}

      - name: Stage sidecar into bundle resources
        run: node scripts/stage-sidecar.mjs
        working-directory: apps/desktop

      - name: Run tests
        run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Developer ID 签名 + 公证（ secrets 配好前 macOS 走 adhoc，不影响其他平台 ）
          # 方式一：开发者证书 .p12 + 公证专用密码（appleid.apple.com 生成）
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # 方式二（推荐）：App Store Connect API Key，二选一即可
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ secrets.APPLE_API_KEY_PATH }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('ServerDesk {0}', github.ref_name) || '' }}
          args: ${{ matrix.args }}
