name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            rust_targets: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: windows-latest # x64
            rust_targets: ""
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: .

      - name: Install frontend deps
        run: pnpm install
        working-directory: apps/desktop

      - name: Check Vue component imports
        run: python3 scripts/check_vue_imports.py
        working-directory: apps/desktop

      - name: Build MCP sidecar (bundled as app resource)
        run: cargo build --release -p serverdesk-mcp

      - name: Run tests
        run: cargo test --workspace

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('ServerDesk {0}', github.ref_name) || '' }}
          args: ${{ matrix.args }}
