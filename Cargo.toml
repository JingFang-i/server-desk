[workspace]
resolver = "2"
members = ["crates/shared", "apps/desktop/src-tauri", "apps/mcp-sidecar"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
shared = { path = "crates/shared" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = ["full"] }
russh = "0.65"
argon2 = "0.5"
keyring = "3"
zeroize = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
aes-gcm = "0.10"
rand = "0.8"
thiserror = "2"
